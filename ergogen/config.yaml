meta:
  engine: 4.1.0
  name: loquat-legiongo
  version: 0.1
  author: Sergei Silnov <po@kumekay.com>

units:
  # Keycap raw size (PG1316S, mikefive-style)
  krx: 16
  kry: 16
  # Key spacing (tight pitch to fit 12 columns in 207mm)
  kx: 16.8
  ky: 16.8
  # Board bounding box (Legion Go tablet is 210x131)
  bw: 207
  bh: 130
  # Azoteq TPS43 touchpad
  tpw: 43
  tph: 40
  # Pinky columns drop relative to ring column (aronia had only ~0.1ky - way too little)
  pinkydrop: 0.45ky

points:
  zones:
    matrix:
      anchor:
        shift: [0, 84]
        rotate: -36
      key:
        padding: 1ky
        spread: 1kx
      columns:
        outerpinky:
          key.shift: [0, 0]
          rows:
            bottom:
              skip: true
        pinky:
        ring:
          key.stagger: 0.5ky
        middle:
          key.stagger: 0.12ky
        index:
          key.stagger: -0.28ky
        inner:
          key.stagger: -0.12ky
      rows:
        bottom:
        home:
        top:
    thumbs:
      # Compact: 3 keys directly under middle/index/inner,
      # no inward extension (center gap between halves is only ~4mm)
      anchor:
        ref: matrix_middle_bottom
        shift: [.7kx, -1.9ky]
      key:
        padding: 1ky
        spread: 1kx
      columns:
        alpha:
        beta:
          # follow the matrix stagger so each thumb key sits 1.05ky
          # below its column's bottom key (compact arc)
          # key.stagger: -0.28ky
        gamma:
          # key.stagger: -0.12ky
      rows:
        cluster:
  mirror:
    ref: matrix_inner_bottom
    distance: 64
outlines:
  _keycaps:
    - what: rectangle
      where: /matrix|thumbs/
      size: [krx, kry]
  # Board frame and touchpad follow the key cluster instead of the reverse.
  # Averaging the two topmost keys (outerpinky_top) with the two bottommost
  # (thumbs_gamma_cluster) lands on the cluster's bounding-box center: the x
  # falls on the mirror axis, and equal |rotation| makes the y the true midpoint.
  _board:
    - what: rectangle
      where:
        aggregate: &cluster_center
          parts:
            - ref: matrix_outerpinky_top
            - ref: mirror_matrix_outerpinky_top
            - ref: thumbs_gamma_cluster
            - ref: mirror_thumbs_gamma_cluster
          method: average
      size: [bw, bh]
  _touchpad:
    - what: rectangle
      where:
        aggregate: *cluster_center
        shift: [0, -44]
      size: [tpw, tph]
  preview:
    - name: _board
    - operation: stack
      name: _keycaps
    - operation: stack
      name: _touchpad
